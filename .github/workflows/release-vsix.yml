name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json (defaults to v<version>)'
        required: false
        type: string
      registry:
        description: 'Extension registry to publish to'
        required: true
        type: choice
        default: all
        options:
          - all
          - marketplace
          - open-vsx
  push:
    tags: ['v*']

permissions:
  contents: read

# Manual dispatch and tag pushes must not publish the same version concurrently.
concurrency:
  group: versiondock-release
  cancel-in-progress: false

jobs:
  release:
    name: Check, package and publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate version and resolve release tag
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release.mjs prepare

      - name: Install dependencies
        run: npm ci

      - name: Check source and run regression tests
        run: npm run check

      - name: Build and package VSIX
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          npm run package -- --out "dist/versiondock-${VERSION}.vsix"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/release.mjs notes

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: versiondock-vsix
          path: dist/*.vsix
          if-no-files-found: error

      - name: Create release tag after successful checks
        if: steps.release.outputs.tag_exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VSIX_NAME: versiondock-${{ steps.release.outputs.version }}.vsix
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            HAS_ASSET="$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[].name] | index(env.VSIX_NAME) != null')"
            if [ "${HAS_ASSET}" = "false" ]; then
              gh release upload "${RELEASE_TAG}" "dist/${VSIX_NAME}"
            fi
          else
            gh release create "${RELEASE_TAG}" "dist/${VSIX_NAME}" \
              --verify-tag --title "VersionDock ${RELEASE_TAG}" \
              --notes-file dist/release-notes.md
          fi

  publish-marketplace:
    name: Publish to Marketplace
    needs: release
    if: github.event_name == 'push' || inputs.registry != 'open-vsx'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select Marketplace authentication
        id: credentials
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_TENANT_ID}" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AZURE_CLIENT_ID}" ] || [ -n "${AZURE_TENANT_ID}" ]; then
            echo "OIDC requires both AZURE_CLIENT_ID and AZURE_TENANT_ID." >&2
            exit 1
          elif [ -n "${VSCE_PAT}" ]; then
            echo "method=pat" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "Skipped Marketplace: neither OIDC variables nor VSCE_PAT are configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout validated release source
        if: steps.credentials.outputs.method != 'none'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        if: steps.credentials.outputs.method != 'none'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked publishing tools
        if: steps.credentials.outputs.method != 'none'
        run: npm ci

      - name: Download validated VSIX
        if: steps.credentials.outputs.method != 'none'
        uses: actions/download-artifact@v7
        with:
          name: versiondock-vsix
          path: dist

      - name: Sign in to Microsoft Entra with GitHub OIDC
        if: steps.credentials.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish with Microsoft Entra identity
        if: steps.credentials.outputs.method == 'oidc'
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VERSION: ${{ needs.release.outputs.version }}
        run: npm exec -- vsce publish --azure-credential --packagePath "dist/versiondock-${VERSION}.vsix" --skip-duplicate

      - name: Publish with PAT
        if: steps.credentials.outputs.method == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: npm exec -- vsce publish --packagePath "dist/versiondock-${VERSION}.vsix" --skip-duplicate

  publish-open-vsx:
    name: Publish to Open VSX
    needs: release
    if: github.event_name == 'push' || inputs.registry != 'marketplace'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Open VSX credentials
        id: credentials
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "${OVSX_PAT}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipped Open VSX: OVSX_PAT is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout validated release source
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked publishing tools
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci

      - name: Download validated VSIX
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: versiondock-vsix
          path: dist

      - name: Publish the packaged extension
        if: steps.credentials.outputs.enabled == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: npm exec -- ovsx publish "dist/versiondock-${VERSION}.vsix" --skip-duplicate
