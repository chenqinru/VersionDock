name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and package VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and run regression tests
        run: npm run check

      - name: Build and package VSIX
        run: |
          mkdir -p dist
          npm run package -- --out dist/versiondock-ci.vsix

      - name: Upload installable VSIX
        uses: actions/upload-artifact@v6
        with:
          name: versiondock-vsix-${{ github.sha }}
          path: dist/versiondock-ci.vsix
          if-no-files-found: error
          retention-days: 14
